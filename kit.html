<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#5b4a63">
<meta name="mobile-web-app-capable" content="yes">
<title>Рисуем по номерам</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/kit.css">
</head>
<body class="kit">

<!-- ============ Галерея набора ============ -->
<section id="gallery" class="screen">
  <header class="gbar">
    <a class="btn" href="./" aria-label="Классический вариант"><svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg><span>Классика</span></a>
    <h1>Рисуем по номерам</h1>
    <span id="offline-badge" class="badge" hidden>Работает без интернета</span>
    <div class="spacer"></div>
    <button id="btn-export" class="btn"><svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg><span>Сохранить копию</span></button>
    <button id="btn-import" class="btn"><svg viewBox="0 0 24 24"><path d="M9 16h6v-6h4l-7-7-7 7h4zm-4 2h14v2H5z"/></svg><span>Загрузить копию</span></button>
    <input id="file-import" type="file" accept=".json,application/json" hidden>
  </header>
  <main id="grid" class="grid kitgrid"></main>
</section>

<!-- ============ Холст ============ -->
<section id="paint" class="screen" hidden>
  <div class="stage">
    <div class="topbar">
      <button id="btn-back" class="btn"><svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg><span>Галерея</span></button>
      <button id="btn-undo" class="btn" aria-label="Отмена"><svg viewBox="0 0 24 24"><path d="M12.5 8c-2.65 0-5.05.99-6.9 2.6L2 7v9h9l-3.62-3.62c1.39-1.16 3.16-1.88 5.12-1.88 3.54 0 6.55 2.31 7.6 5.5l2.37-.78C21.08 11.03 17.15 8 12.5 8z"/></svg><span>Отмена</span></button>
      <button id="btn-redo" class="btn" aria-label="Повтор"><svg viewBox="0 0 24 24"><path d="M18.4 10.6C16.55 8.99 14.15 8 11.5 8c-4.65 0-8.58 3.03-9.96 7.22L3.9 16c1.05-3.19 4.05-5.5 7.6-5.5 1.95 0 3.73.72 5.12 1.88L13 16h9V7l-3.6 3.6z"/></svg><span>Повтор</span></button>
      <div class="seg" role="group" aria-label="Инструмент">
        <button class="segbtn tool" data-tool="b0" aria-label="Тонкая кисть"><i class="dot" style="width:10px;height:10px"></i></button>
        <button class="segbtn tool" data-tool="b1" aria-label="Средняя кисть"><i class="dot" style="width:18px;height:18px"></i></button>
        <button class="segbtn tool" data-tool="b2" aria-label="Толстая кисть"><i class="dot" style="width:28px;height:28px"></i></button>
        <button class="segbtn tool" data-tool="fill" aria-label="Залить область"><svg viewBox="0 0 24 24"><path d="M16.56 8.94L7.62 0 6.21 1.41l2.38 2.38-5.15 5.15c-.59.59-.59 1.54 0 2.12l5.5 5.5c.29.29.68.44 1.06.44s.77-.15 1.06-.44l5.5-5.5c.59-.58.59-1.53 0-2.12zM5.21 10L10 5.21 14.79 10H5.21zM19 11.5s-2 2.17-2 3.5c0 1.1.9 2 2 2s2-.9 2-2c0-1.33-2-3.5-2-3.5z"/></svg></button>
      </div>
      <button id="btn-hint" class="btn accent" aria-label="Подсказка"><svg viewBox="0 0 24 24"><path d="M9 21c0 .55.45 1 1 1h4c.55 0 1-.45 1-1v-1H9v1zm3-19C8.14 2 5 5.14 5 9c0 2.38 1.19 4.47 3 5.74V17c0 .55.45 1 1 1h6c.55 0 1-.45 1-1v-2.26c1.81-1.27 3-3.36 3-5.74 0-3.86-3.14-7-7-7z"/></svg><span>Подсказка</span></button>
      <div class="spacer"></div>
      <span id="pct" class="pct">0%</span>
      <button id="btn-clear" class="btn" aria-label="Очистить"><svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg></button>
    </div>
    <div id="host" class="canvas-host">
      <canvas id="cv"></canvas>
      <div class="zoombtns">
        <button id="z-in" class="btn sq" aria-label="Приблизить"><svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg></button>
        <button id="z-out" class="btn sq" aria-label="Отдалить"><svg viewBox="0 0 24 24"><path d="M19 13H5v-2h14v2z"/></svg></button>
        <button id="z-anim" class="btn sq" aria-label="Анимация красок" aria-pressed="true"><svg viewBox="0 0 24 24"><path d="M19 9l1.25-2.75L23 5l-2.75-1.25L19 1l-1.25 2.75L15 5l2.75 1.25L19 9zm-7.5.5L9 4 6.5 9.5 1 12l5.5 2.5L9 20l2.5-5.5L17 12l-5.5-2.5zM19 15l-1.25 2.75L15 19l2.75 1.25L19 23l1.25-2.75L23 19l-2.75-1.25L19 15z"/></svg></button>
        <button id="z-fit" class="btn sq" aria-label="Сбросить масштаб"><svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg></button>
      </div>
      <div id="loading" class="loading" hidden><div class="spinner"></div><div id="loading-text">Готовлю картинку…</div></div>
    </div>
  </div>
  <aside id="palette" class="panel kitpanel" aria-label="Баночки с краской"></aside>
</section>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<div id="modal" class="modal" hidden>
  <div class="dialog">
    <h2 id="modal-title"></h2>
    <p id="modal-text"></p>
    <div class="dlg-btns">
      <button id="modal-cancel" class="btn">Отмена</button>
      <button id="modal-ok" class="btn accent">Да</button>
    </div>
  </div>
</div>

<script type="module" src="js/kit.js"></script>
</body>
</html>
